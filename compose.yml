services:
  postgres:
    container_name: postgres

    image: postgres:18-alpine

    security_opt:
      - no-new-privileges:true

    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres

    volumes:
      - postgres:/data/postgres

    ports: 
      - "${POSTGRES_PORT}"

    networks:
      - springboot-net

    restart: unless-stopped

networks:
  springboot-net:
    external: true
    name: springboot-net

volumes:
  postgres:
